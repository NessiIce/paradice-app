<!DOCTYPE html>
<html lang="ru">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Шрифт Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-main: #FDF6E4;
            --bg-card: #FFFFFF;
            --bg-card-soft: #F6ECD4;
            --text-main: #023E43;
            --text-muted: #3A676A;
            --accent: #00A19D;
            --accent-dark: #023E43;
            --gold: #F5A600;
            --gold-soft: #FFF4D4;
            --border-color: rgba(2, 62, 67, 0.14);
            --card-radius: 20px;
            --btn-radius: 14px;
            --shadow-card: 0 8px 24px -6px rgba(2, 62, 67, 0.10);
        }

        html.dark-theme {
            --bg-main: #071E22;
            --bg-card: #0D2B30;
            --bg-card-soft: #133940;
            --text-main: #F8F3E6;
            --text-muted: #98BFC2;
            --accent: #14B8B3;
            --accent-dark: #062226;
            --gold: #F5A600;
            --gold-soft: rgba(245, 166, 0, 0.16);
            --border-color: rgba(152, 191, 194, 0.18);
            --shadow-card: 0 10px 28px -6px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Фирменный фоновый узор граней D20 */
        .bg-d20-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='140' height='140' viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%2300A19D' stroke-opacity='0.11' stroke-width='1.5'%3E%3Cpolygon points='70,12 118,40 118,96 70,124 22,96 22,40'/%3E%3Cpolygon points='70,32 100,82 40,82'/%3E%3Cline x1='70' y1='12' x2='70' y2='32'/%3E%3Cline x1='118' y1='40' x2='70' y2='32'/%3E%3Cline x1='22' y1='40' x2='70' y2='32'/%3E%3Cline x1='118' y1='40' x2='100' y2='82'/%3E%3Cline x1='118' y1='96' x2='100' y2='82'/%3E%3Cline x1='70' y1='124' x2='100' y2='82'/%3E%3Cline x1='70' y1='124' x2='40' y2='82'/%3E%3Cline x1='22' y1='96' x2='40' y2='82'/%3E%3Cline x1='22' y1='40' x2='40' y2='82'/%3E%3C/g%3E%3C/svg%3E");
            background-size: 140px 140px;
        }

        .bg-dots-pattern {
            background-image: radial-gradient(rgba(0, 161, 157, 0.16) 1.5px, transparent 1.5px);
            background-size: 20px 20px;
        }

        .bg-clean-pattern {
            background-image: none;
        }

        .pd-card {
            background-color: var(--bg-card);
            border: 1.5px solid var(--border-color);
            border-radius: var(--card-radius);
            box-shadow: var(--shadow-card);
            transition: transform 0.15s ease, box-shadow 0.2s ease, background-color 0.25s ease;
        }

        .pd-card-soft {
            background-color: var(--bg-card-soft);
            border: 1px solid var(--border-color);
            border-radius: calc(var(--card-radius) - 4px);
        }

        .pd-btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, #008582 100%);
            color: #FFFFFF;
            border-radius: var(--btn-radius);
            font-weight: 800;
            box-shadow: 0 4px 14px rgba(0, 161, 157, 0.30);
            transition: transform 0.12s ease, opacity 0.15s ease;
        }

        .pd-btn-primary:active {
            transform: scale(0.97);
        }

        .pd-btn-gold {
            background: linear-gradient(135deg, #FFB81C 0%, #F5A600 100%);
            color: #023E43;
            border-radius: var(--btn-radius);
            font-weight: 900;
            box-shadow: 0 4px 14px rgba(245, 166, 0, 0.32);
            transition: transform 0.12s ease;
        }

        .pd-btn-gold:active {
            transform: scale(0.97);
        }

        .pd-btn-outline {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1.5px solid var(--border-color);
            border-radius: var(--btn-radius);
            font-weight: 700;
            transition: transform 0.12s ease, background-color 0.15s ease;
        }

        .pd-btn-outline:active {
            transform: scale(0.97);
        }

        .pd-input {
            width: 100%;
            background-color: var(--bg-card-soft);
            color: var(--text-main);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .pd-input:focus {
            border-color: var(--accent);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.18); opacity: 0.75; }
        }
        .sync-dot-active {
            animation: pulseGlow 2.2s infinite ease-in-out;
        }

        @keyframes modalPop {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-animate {
            animation: modalPop 0.2s ease-out forwards;
        }
    </style>
</head>

    <!-- Логика приложения и Firebase Firestore Live Sync -->

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 1. ИНИЦИАЛИЗАЦИЯ TELEGRAM И ПОЛЬЗОВАТЕЛЯ

        const tg = window.Telegram?.WebApp;
        if (tg) {
            try {
                tg.ready();
                tg.expand();
            } catch (e) {}
        }

        function resolveTelegramUser() {
            const u = tg?.initDataUnsafe?.user;
            if (u && u.id) {
                const fullName = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'Игрок клуба';
                return {
                    id: String(u.id),
                    name: fullName,
                    username: u.username ? `@${u.username}` : '',
                    initials: fullName.slice(0, 2).toUpperCase()
                };
            }
            let localGuestId = localStorage.getItem('pd_guest_id');
            if (!localGuestId) {
                localGuestId = 'guest_' + Math.floor(100000 + Math.random() * 900000);
                localStorage.setItem('pd_guest_id', localGuestId);
            }
            return {
                id: localGuestId,
                name: 'Гость клуба',
                username: '@player',
                initials: 'ГК'
            };
        }

        const currentUser = resolveTelegramUser();

        // ==========================================

        // ==========================================
        function formatKZT(amount) {
            const num = Math.max(0, Math.round(Number(amount) || 0));
            if (num === 0) return '0 ₸';
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₸';
        }

        function generateCoverSvg(title, emoji = '🎲', bg1 = '#00A19D', bg2 = '#023E43') {
            const safeTitle = String(title || 'Игра').slice(0, 26).replace(/[<>&"']/g, '');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320">
                <defs>
                    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="${bg1}"/>
                        <stop offset="100%" stop-color="${bg2}"/>
                    </linearGradient>
                </defs>
                <rect width="600" height="320" fill="url(#g)"/>
                <circle cx="520" cy="60" r="95" fill="#F5A600" fill-opacity="0.16"/>
                <circle cx="85" cy="270" r="110" fill="#FFFFFF" fill-opacity="0.07"/>
                <text x="50%" y="44%" dominant-baseline="middle" text-anchor="middle" font-size="76">${emoji}</text>
                <text x="50%" y="76%" dominant-baseline="middle" text-anchor="middle" fill="#FDF6E4" font-family="sans-serif" font-weight="800" font-size="28">${safeTitle}</text>
            </svg>`;
            return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
        }

        function simpleHash(str) {
            let h = 2166136261;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
            }
            return (h >>> 0).toString(16);
        }

            return {
                userId: currentUser.id,

        // ==========================================
        // 3. СОСТОЯНИЕ ПРИЛОЖЕНИЯ И CLOUD SYNC
        // ==========================================
        const LOCAL_SHARED_KEY = 'paradice_shared_v3';
        const LOCAL_USER_KEY = `paradice_user_${currentUser.id}_v3`;
        const LOCAL_BOOKINGS_KEY = 'paradice_bookings_v3';
        const LOCAL_LOGS_KEY = 'paradice_logs_v3';
        const LOCAL_THEME_KEY = 'paradice_theme_v3';

        let sharedState = loadLocalJson(LOCAL_SHARED_KEY, createDefaultSharedState());
        let userProfile = loadLocalJson(LOCAL_USER_KEY, createDefaultUserProfile());
        let allBookings = loadLocalJson(LOCAL_BOOKINGS_KEY, []);
        let adminLogs = loadLocalJson(LOCAL_LOGS_KEY, []);
        let themePrefs = loadLocalJson(LOCAL_THEME_KEY, {
            mode: 'light',
            accent: '#00A19D',
            pattern: 'bg-d20-pattern',
            radius: '20px'
        });

        let activeTab = 'events';
        let eventsFilter = 'all';
        let catalogSearch = '';
        let catalogGenre = 'Все';
        let shopSearch = '';
        let shopSort = 'default';
        let cart = [];
        let isAdminMode = false;
        let adminFailCount = 0;
        let adminLockUntil = 0;

        function loadLocalJson(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return fallback;
                return Object.assign({}, fallback, JSON.parse(raw));
            } catch (e) {
                return fallback;
            }
        }

        function saveLocalJson(key, data) {
            try {
                localStorage.setItem(key, JSON.stringify(data));
            } catch (e) {}
        }

        // Подключение Firestore (если доступно окружение)
        let db = null;
        let auth = null;
        let appId = 'paradice-club-app';
        let isCloudReady = false;

        async function initCloudSync() {
            const dot = document.getElementById('cloudStatusDot');
            try {
                if (typeof __firebase_config === 'undefined') {
                    if (dot) dot.className = 'w-2 h-2 rounded-full bg-amber-400 shrink-0';
                    return;
                }
                const firebaseConfig = JSON.parse(__firebase_config);
                appId = typeof __app_id !== 'undefined' ? __app_id : 'paradice-club-app';
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                isCloudReady = true;
                if (dot) dot.className = 'w-2 h-2 rounded-full bg-emerald-500 sync-dot-active shrink-0';

                // 1. Слушаем общие настройки клуба, анонсы, каталог и витрину
                const sharedDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'club_state', 'main');
                onSnapshot(sharedDocRef, (snap) => {
                    if (snap.exists()) {
                        const remote = snap.data();
                        sharedState = Object.assign(createDefaultSharedState(), remote);
                        saveLocalJson(LOCAL_SHARED_KEY, sharedState);
                        renderHeader();
                        renderActiveTab();
                    } else {
                        setDoc(sharedDocRef, sharedState).catch(() => {});
                    }
                }, () => {});

                // 2. Слушаем все записи за столы в реальном времени
                const bookingsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'bookings');
                onSnapshot(bookingsColRef, (snap) => {
                    const list = [];
                    snap.forEach(d => list.push(d.data()));
                    allBookings = list;
                    saveLocalJson(LOCAL_BOOKINGS_KEY, allBookings);
                    renderActiveTab();
                }, () => {});

                // 3. Слушаем журнал записей для админа
                const logsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'admin_logs');
                onSnapshot(logsColRef, (snap) => {
                    const list = [];
                    snap.forEach(d => list.push(d.data()));
                    list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    adminLogs = list.slice(0, 40);
                    saveLocalJson(LOCAL_LOGS_KEY, adminLogs);
                    if (activeTab === 'cabinet' && isAdminMode) renderActiveTab();
                }, () => {});

                // 4. Слушаем личный кабинет текущего пользователя
                const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'user_profiles', currentUser.id);
                onSnapshot(userDocRef, (snap) => {
                    if (snap.exists()) {
                        userProfile = Object.assign(createDefaultUserProfile(), snap.data());
                        saveLocalJson(LOCAL_USER_KEY, userProfile);
                        if (activeTab === 'cabinet') renderActiveTab();
                    } else {
                        setDoc(userDocRef, userProfile).catch(() => {});
                    }
                }, () => {});

            } catch (err) {
                if (dot) dot.className = 'w-2 h-2 rounded-full bg-amber-400 shrink-0';
            }
        }

        async function persistSharedState() {
            saveLocalJson(LOCAL_SHARED_KEY, sharedState);
            renderHeader();
            renderActiveTab();
            if (isCloudReady && db && auth?.currentUser) {
                try {
                    const sharedDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'club_state', 'main');
                    await setDoc(sharedDocRef, sharedState);
                } catch (e) {}
            }
        }

        async function persistUserProfile() {
            saveLocalJson(LOCAL_USER_KEY, userProfile);
            if (activeTab === 'cabinet') renderActiveTab();
            if (isCloudReady && db && auth?.currentUser) {
                try {
                    const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'user_profiles', currentUser.id);
                    await setDoc(userDocRef, userProfile);
                } catch (e) {}
            }
        }

        async function saveBookingRecord(booking) {
            const idx = allBookings.findIndex(b => b.id === booking.id);
            if (idx >= 0) allBookings[idx] = booking;
            else allBookings.push(booking);
            saveLocalJson(LOCAL_BOOKINGS_KEY, allBookings);
            renderActiveTab();

            if (isCloudReady && db && auth?.currentUser) {
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bookings', booking.id), booking);
                } catch (e) {}
            }
        }

        async function deleteBookingRecord(bookingId) {
            allBookings = allBookings.filter(b => b.id !== bookingId);
            saveLocalJson(LOCAL_BOOKINGS_KEY, allBookings);
            renderActiveTab();

            if (isCloudReady && db && auth?.currentUser) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bookings', bookingId));
                } catch (e) {}
            }
        }

        // Отправка уведомления админу в Telegram и запись в журнал
        async function notifyAdmin(title, text) {
            const logEntry = {
                id: 'log_' + Date.now() + '_' + Math.floor(Math.random() * 999),
                title,
                text,
                time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + ', ' + new Date().toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }),
                timestamp: Date.now()
            };
            adminLogs.unshift(logEntry);
            adminLogs = adminLogs.slice(0, 40);
            saveLocalJson(LOCAL_LOGS_KEY, adminLogs);

            if (isCloudReady && db && auth?.currentUser) {
                setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'admin_logs', logEntry.id), logEntry).catch(() => {});
            }

            const cfg = sharedState.telegramNotify || {};
            if (cfg.enabled && cfg.botToken && cfg.adminChatId) {
                const message = `🎲 *${sharedState.club.name} — ${title}*\n\n${text}`;
                fetch(`https://api.telegram.org/bot${cfg.botToken.trim()}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: cfg.adminChatId.trim(),
                        text: message,
                        parse_mode: 'Markdown'
                    })
                }).catch(() => {});
            }
        }

        // ==========================================
        // 4. ПРИМЕНЕНИЕ ТЕМЫ И ШАПКИ
        // ==========================================
        function applyTheme() {
            const root = document.documentElement;
            if (themePrefs.mode === 'dark') {
                root.classList.add('dark-theme');
            } else {
                root.classList.remove('dark-theme');
            }
            root.style.setProperty('--accent', themePrefs.accent || '#00A19D');
            root.style.setProperty('--card-radius', themePrefs.radius || '20px');

            document.body.classList.remove('bg-d20-pattern', 'bg-dots-pattern', 'bg-clean-pattern');
            document.body.classList.add(themePrefs.pattern || 'bg-d20-pattern');

            if (tg) {
                try {
                    const bg = themePrefs.mode === 'dark' ? '#071E22' : '#FDF6E4';
                    tg.setHeaderColor(bg);
                    tg.setBackgroundColor(bg);
                } catch (e) {}
            }
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = 'px-4 py-2.5 rounded-2xl text-xs font-extrabold shadow-lg border flex items-center gap-2 modal-animate';
            el.style.backgroundColor = type === 'error' ? '#FEE2E2' : 'var(--bg-card)';
            el.style.color = type === 'error' ? '#991B1B' : 'var(--text-main)';
            el.style.borderColor = type === 'error' ? '#FCA5A5' : 'var(--accent)';
            el.innerHTML = `<span>${type === 'error' ? '⚠️' : '✨'}</span><span>${msg}</span>`;
            container.appendChild(el);
            setTimeout(() => el.remove(), 2800);

        // 8. ВКЛАДКА 4: ЛИЧНЫЙ КАБИНЕТ И КАРТА ЛОЯЛЬНОСТИ (9-Я ИГРА БЕСПЛАТНО)
        // ==========================================
        function buildQrSvg(codeText) {
            const size = 21;
            let hash = 0;
            for (let i = 0; i < codeText.length; i++) {
                hash = ((hash << 5) - hash) + codeText.charCodeAt(i);
                hash |= 0;
            }
            let rects = '';
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const isFinder = (r < 7 && c < 7) || (r < 7 && c >= size - 7) || (r >= size - 7 && c < 7);
                    let fill = false;
                    if (isFinder) {
                        const lr = r < 7 ? r : r - (size - 7);
                        const lc = c < 7 ? c : c - (size - 7);
                        fill = lr === 0 || lr === 6 || lc === 0 || lc === 6 || (lr >= 2 && lr <= 4 && lc >= 2 && lc <= 4);
                    } else {
                        fill = (((r * 31 + c * 17 + Math.abs(hash)) % 7) < 3);
                    }
                    if (fill) {
                        rects += `<rect x="${c * 10}" y="${r * 10}" width="10" height="10" rx="2" fill="#023E43"/>`;
                    }
                }
            }
            return `<svg viewBox="0 0 ${size * 10} ${size * 10}" class="w-full h-full">${rects}</svg>`;
        }

        // ==========================================
        function openModal(innerHtml) {

        window.closeModal = function () {

        };

        // Запись на игротеку
        window.openBookingModal = function (eventId) {
            const ev = sharedState.events.find(e => e.id === eventId);
            if (!ev) return;
            const taken = allBookings.filter(b => b.eventId === ev.id).reduce((s, b) => s + (b.seats || 1), 0);
            const free = Math.max(1, ev.maxSeats - taken);

            openModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-black">Запись на игротеку</h3>
                        <button onclick="closeModal()" class="p-1.5 rounded-xl pd-card-soft"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <div class="pd-card-soft p-3 text-xs space-y-1">
                        <div class="font-black text-sm">${ev.title}</div>
                        <div style="color: var(--text-muted);">📅 ${ev.date} • 🎲 ${ev.game}</div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-xs font-extrabold">Ваше имя</label>
                        <input type="text" id="bookUserName" value="${currentUser.name}" class="pd-input">
                    </div>

                        <label class="text-xs font-extrabold">Количество мест (доступно: ${free})</label>
                        <input type="number" id="bookSeats" min="1" max="${free}" value="1" oninput="recalcBookingTotal('${ev.id}')" class="pd-input">
                    </div>

                    ${userProfile.hasCard && userProfile.freeGamesAvailable > 0 ? `
                        <label class="flex items-center gap-2.5 p-3 rounded-xl border cursor-pointer" style="background-color: var(--gold-soft); border-color: var(--gold);">
                            <input type="checkbox" id="bookUseFreeGame" onchange="recalcBookingTotal('${ev.id}')" class="w-4 h-4">
                            <span class="text-xs font-black">🎁 Использовать бесплатную ${sharedState.bonusRules.freeGameEvery}-ю игру (1 место за 0 ₸)</span>
                        </label>
                    ` : ''}

                    ${userProfile.hasCard && userProfile.balance > 0 && sharedState.bonusRules.allowBonusPay ? `
                        <label class="flex items-center gap-2.5 p-3 rounded-xl pd-card-soft cursor-pointer">
                            <input type="checkbox" id="bookUseBonus" onchange="recalcBookingTotal('${ev.id}')" class="w-4 h-4">
                            <span class="text-xs font-extrabold">Списать бонусы (доступно ${formatKZT(userProfile.balance)}, до ${sharedState.bonusRules.maxBonusPayPercent}%)</span>
                        </label>
                    ` : ''}

                    <div class="space-y-2">
                        <label class="text-xs font-extrabold">Комментарий или телефон (необязательно)</label>
                        <input type="text" id="bookComment" placeholder="Например: приду с другом, +7 707..." class="pd-input">
                    </div>

                    <div class="pd-card-soft p-3.5 flex items-center justify-between">
                        <span class="text-xs font-extrabold">Итого к оплате в клубе:</span>
                        <span id="bookTotalText" class="text-lg font-black" style="color: var(--accent);">${formatKZT(ev.price)}</span>
                    </div>

                    <button onclick="confirmBooking('${ev.id}')" class="w-full pd-btn-primary py-3 text-sm">Подтвердить запись</button>
                </div>
            `);
        };

        window.recalcBookingTotal = function (eventId) {
            const ev = sharedState.events.find(e => e.id === eventId);
            if (!ev) return;
            const seats = Math.max(1, Number(document.getElementById('bookSeats')?.value) || 1);
            const useFree = document.getElementById('bookUseFreeGame')?.checked || false;
            const useBonus = document.getElementById('bookUseBonus')?.checked || false;

            const payableSeats = useFree ? Math.max(0, seats - 1) : seats;
            let total = payableSeats * ev.price;

            if (useBonus && total > 0) {
                const maxDiscount = Math.floor(total * (sharedState.bonusRules.maxBonusPayPercent / 100));
                const discount = Math.min(userProfile.balance, maxDiscount);
                total -= discount;
            }
            const el = document.getElementById('bookTotalText');
            if (el) el.textContent = formatKZT(total);
        };

        window.confirmBooking = async function (eventId) {
            const ev = sharedState.events.find(e => e.id === eventId);
            if (!ev) return;
            const name = document.getElementById('bookUserName').value.trim() || currentUser.name;
            const seats = Math.max(1, Number(document.getElementById('bookSeats').value) || 1);
            const useFree = document.getElementById('bookUseFreeGame')?.checked || false;
            const useBonus = document.getElementById('bookUseBonus')?.checked || false;
            const comment = document.getElementById('bookComment').value.trim();

            const payableSeats = useFree ? Math.max(0, seats - 1) : seats;
            let finalPrice = payableSeats * ev.price;
            let spentBonus = 0;

            if (useBonus && finalPrice > 0) {
                const maxDiscount = Math.floor(finalPrice * (sharedState.bonusRules.maxBonusPayPercent / 100));
                spentBonus = Math.min(userProfile.balance, maxDiscount);
                finalPrice -= spentBonus;
            }

            if (useFree && userProfile.freeGamesAvailable > 0) {
                userProfile.freeGamesAvailable -= 1;
                userProfile.history.unshift({
                    title: `Бесплатная ${sharedState.bonusRules.freeGameEvery}-я игра: ${ev.title}`,
                    date: new Date().toLocaleDateString('ru-RU'),
                    delta: 0,
                    badge: '🎁 0 ₸'
                });
            }
            if (spentBonus > 0) {
                userProfile.balance -= spentBonus;
                userProfile.history.unshift({
                    title: `Списание на игротеку: ${ev.title}`,
                    date: new Date().toLocaleDateString('ru-RU'),
                    delta: -spentBonus
                });
            }
            await persistUserProfile();

            const booking = {
                id: 'bk_' + Date.now() + '_' + currentUser.id,
                eventId: ev.id,
                eventTitle: ev.title,
                userId: currentUser.id,
                userName: name,
                username: currentUser.username,
                seats,
                finalPrice,
                spentBonus,
                usedFreeGame: useFree,
                comment,
                createdAt: Date.now()
            };

            await saveBookingRecord(booking);
            await notifyAdmin(
                'Новая запись на игротеку!',
                `🎲 Игра: ${ev.title} (${ev.date})\n👤 Гость: ${name} ${currentUser.username}\n💺 Мест: ${seats}\n💰 К оплате: ${useFree ? '🎁 Бесплатная 9-я игра (0 ₸)' : formatKZT(finalPrice)}${comment ? `\n💬 Комментарий: ${comment}` : ''}`
            );

            closeModal();
            showToast('Вы успешно записаны за стол!');
        };

        window.cancelBooking = async function (bookingId) {
            const bk = allBookings.find(b => b.id === bookingId);
            if (!bk) return;

            if (bk.spentBonus > 0) {
                userProfile.balance += bk.spentBonus;
            }
            if (bk.usedFreeGame) {
                userProfile.freeGamesAvailable = (userProfile.freeGamesAvailable || 0) + 1;

            await deleteBookingRecord(bookingId);

                    ${subTab === 'notify' ? `

                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-black">${g ? 'Редактировать игру зала' : 'Добавить игру в зал'}</h3>
                        <button onclick="closeModal()" class="p-1.5 rounded-xl pd-card-soft"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <div class="grid grid-cols-4 gap-2">
                        <input type="text" id="catEmoji" value="${g?.emoji || '🎲'}" class="pd-input text-center text-lg">
                        <input type="text" id="catTitle" value="${g?.title || ''}" placeholder="Название игры" class="pd-input col-span-3">
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <input type="text" id="catPlayers" value="${g?.players || '2–4'}" placeholder="Игроки" class="pd-input">
                        <input type="text" id="catTime" value="${g?.time || '60 мин'}" placeholder="Время" class="pd-input">
                        <input type="text" id="catGenre" value="${g?.genre || 'Стратегия'}" placeholder="Жанр" class="pd-input">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs font-extrabold">Картинка к описанию (ссылка или файл с устройства)</label>
                        <input type="text" id="catImageUrl" value="${g?.image && !g.image.startsWith('data:image/svg') ? g.image : ''}" placeholder="https://..." class="pd-input">
                        <input type="file" accept="image/*" onchange="handleFileToDataUrl(this, 'catImageUrl')" class="text-xs">
                    </div>
                    <textarea id="catDesc" rows="3" placeholder="Описание настольной игры для гостей зала..." class="pd-input">${g?.description || ''}</textarea>
                    <button onclick="saveCatalogGame('${gameId || ''}')" class="w-full pd-btn-primary py-3 text-sm">Сохранить в коллекцию</button>
                </div>
            `);
        };

        window.handleFileToDataUrl = function (input, targetInputId) {
            const file = input.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const maxW = 640;
                    const scale = Math.min(1, maxW / img.width);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    document.getElementById(targetInputId).value = canvas.toDataURL('image/jpeg', 0.78);
                    showToast('Изображение загружено');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.saveCatalogGame = async function (gameId) {
            const title = document.getElementById('catTitle').value.trim() || 'Настольная игра';
            const emoji = document.getElementById('catEmoji').value.trim() || '🎲';
            const rawImg = document.getElementById('catImageUrl').value.trim();
            const item = {
                id: gameId || 'cat_' + Date.now(),
                title,
                emoji,
                players: document.getElementById('catPlayers').value.trim() || '2–4',
                time: document.getElementById('catTime').value.trim() || '60 мин',
                age: '10+',
                genre: document.getElementById('catGenre').value.trim() || 'Стратегия',
                complexity: 'Средняя',
                image: rawImg || generateCoverSvg(title, emoji),
                description: document.getElementById('catDesc').value.trim()
            };
            if (gameId) {
                const idx = sharedState.catalog.findIndex(x => x.id === gameId);
                if (idx >= 0) sharedState.catalog[idx] = item;
            } else {
                sharedState.catalog.unshift(item);
            }
            await persistSharedState();
            closeModal();
            showToast('Игра сохранена в каталог зала');
        };

        window.deleteCatalogGame = async function (id) {
            sharedState.catalog = sharedState.catalog.filter(g => g.id !== id);
            await persistSharedState();
            showToast('Игра удалена из каталога');
        };

        // Добавление/редактирование товара магазина (Админ)
        window.openShopItemModal = function (itemId = null) {
            const it = itemId ? sharedState.shop.find(x => x.id === itemId) : null;
            openModal(`
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-black">${it ? 'Редактировать товар' : 'Новый товар на продажу'}</h3>
                        <button onclick="closeModal()" class="p-1.5 rounded-xl pd-card-soft"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <input type="text" id="shTitle" value="${it?.title || ''}" placeholder="Название коробки" class="pd-input">
                    <div class="grid grid-cols-3 gap-2">
                        <input type="number" id="shPrice" value="${it ? it.price : 15000}" placeholder="Цена (₸)" class="pd-input">
                        <input type="number" id="shOldPrice" value="${it?.oldPrice || ''}" placeholder="Старая цена" class="pd-input">
                        <input type="number" id="shStock" value="${it ? it.stock : 3}" placeholder="Остаток" class="pd-input">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs font-extrabold">Фото коробки (ссылка или файл)</label>
                        <input type="text" id="shImageUrl" value="${it?.image && !it.image.startsWith('data:image/svg') ? it.image : ''}" placeholder="https://..." class="pd-input">
                        <input type="file" accept="image/*" onchange="handleFileToDataUrl(this, 'shImageUrl')" class="text-xs">
                    </div>
                    <textarea id="shDesc" rows="2" placeholder="Описание товара..." class="pd-input">${it?.description || ''}</textarea>
                    <button onclick="saveShopItem('${itemId || ''}')" class="w-full pd-btn-primary py-3 text-sm">Сохранить на витрине</button>
                </div>
            `);
        };

        window.saveShopItem = async function (itemId) {
            const title = document.getElementById('shTitle').value.trim() || 'Настольная игра';
            const rawImg = document.getElementById('shImageUrl').value.trim();
            const item = {
                id: itemId || 'shop_' + Date.now(),
                title,
                emoji: '🎁',
                price: Math.max(0, Number(document.getElementById('shPrice').value) || 0),
                oldPrice: Math.max(0, Number(document.getElementById('shOldPrice').value) || 0),
                stock: Math.max(0, Number(document.getElementById('shStock').value) || 0),
                players: '2–5',
                badge: 'Новая в плёнке',
                image: rawImg || generateCoverSvg(title, '🎁', '#F5A600', '#023E43'),
                description: document.getElementById('shDesc').value.trim()
            };
            if (itemId) {
                const idx = sharedState.shop.findIndex(x => x.id === itemId);
                if (idx >= 0) sharedState.shop[idx] = item;
            } else {
                sharedState.shop.unshift(item);
            }
            await persistSharedState();
            closeModal();
            showToast('Витрина магазина обновлена');
        };

        window.deleteShopItem = async function (id) {
            sharedState.shop = sharedState.shop.filter(x => x.id !== id);
            await persistSharedState();
            showToast('Товар удалён с витрины');
        };

        window.adjustShopStock = async function (id, delta) {
            const it = sharedState.shop.find(x => x.id === id);
            if (!it) return;
            it.stock = Math.max(0, (it.stock || 0) + delta);
            await persistSharedState();
        };

        // Импорт списком (игры зала или прайс магазина)
        window.openBulkImportModal = function (mode) {
            openModal(`
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-black">${mode === 'shop' ? 'Добавить прайс-листом' : 'Добавить список игр зала'}</h3>
                        <button onclick="closeModal()" class="p-1.5 rounded-xl pd-card-soft"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <p class="text-xs" style="color: var(--text-muted);">
                        ${mode === 'shop'
                            ? 'Каждая строка: Название | Цена в ₸ | Остаток шт.'
                            : 'Каждая строка: Название | Игроки | Время | Жанр'}
                    </p>
                    <textarea id="bulkLinesInput" rows="6" placeholder="${mode === 'shop' ? 'Каркассон | 14500 | 3\nКодовые имена | 11900 | 5' : 'Каркассон | 2-5 | 45 мин | Семейная\nМафия | 6-15 | 40 мин | Вечеринка'}" class="pd-input"></textarea>
                    <button onclick="processBulkImport('${mode}')" class="w-full pd-btn-primary py-3 text-sm">Импортировать список</button>
                </div>
            `);
        };

        window.processBulkImport = async function (mode) {
            const lines = document.getElementById('bulkLinesInput').value.split('\n').map(l => l.trim()).filter(Boolean);
            if (lines.length === 0) return;

            lines.forEach((line, idx) => {
                const parts = line.split('|').map(p => p.trim());
                if (mode === 'shop') {
                    const title = parts[0] || 'Игра';
                    sharedState.shop.unshift({
                        id: 'shop_' + Date.now() + '_' + idx,
                        title,
                        emoji: '🎁',
                        price: Number(parts[1]) || 15000,
                        oldPrice: 0,
                        stock: Number(parts[2]) || 2,
                        players: '2–5',
                        badge: 'В наличии',
                        image: generateCoverSvg(title, '🎁', '#F5A600', '#023E43'),
                        description: 'Новая запечатанная коробка в плёнке.'
                    });
                } else {
                    const title = parts[0] || 'Игра';
                    sharedState.catalog.unshift({
                        id: 'cat_' + Date.now() + '_' + idx,
                        title,
                        emoji: '🎲',
                        players: parts[1] || '2–4',
                        time: parts[2] || '60 мин',
                        age: '10+',
                        genre: parts[3] || 'Стратегия',
                        complexity: 'Средняя',
                        image: generateCoverSvg(title, '🎲'),
                        description: 'Доступна для игр в зале клуба.'
                    });
                }
            });

            await persistSharedState();
            closeModal();
            showToast(`Добавлено позиций: ${lines.length}`);
        };

        // Корзина и оформление заказа
        window.addToCart = function (id) {
            const prod = sharedState.shop.find(p => p.id === id);
            if (!prod || prod.stock <= 0) return;
            const existing = cart.find(c => c.id === id);
            if (existing) {
                if (existing.qty < prod.stock) existing.qty++;
            } else {
                cart.push({ id, qty: 1 });
            }
            updateNavigation();
            renderActiveTab();
            showToast('Добавлено в корзину');
        };

        window.changeCartQty = function (id, delta) {
            const prod = sharedState.shop.find(p => p.id === id);
            const idx = cart.findIndex(c => c.id === id);
            if (idx < 0) return;
            cart[idx].qty += delta;
            if (cart[idx].qty <= 0) cart.splice(idx, 1);
            else if (prod && cart[idx].qty > prod.stock) cart[idx].qty = prod.stock;
            updateNavigation();
            renderActiveTab();
        };

        window.openCartModal = function () {
            const rows = cart.map(c => {
                const p = sharedState.shop.find(x => x.id === c.id);
                return p ? `<div class="flex justify-between text-xs font-extrabold"><span>${p.title} × ${c.qty}</span><span>${formatKZT(p.price * c.qty)}</span></div>` : '';
            }).join('');
            const total = cart.reduce((s, c) => {
                const p = sharedState.shop.find(x => x.id === c.id);
                return s + (p ? p.price * c.qty : 0);
            }, 0);

            openModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-black">Оформление заказа</h3>
                        <button onclick="closeModal()" class="p-1.5 rounded-xl pd-card-soft"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <div class="pd-card-soft p-3 space-y-2">${rows}</div>
                    <input type="text" id="orderPhone" placeholder="Ваш телефон для связи (+7...)" class="pd-input">
                    <div class="flex justify-between items-center font-black">
                        <span class="text-xs">Итого к оплате:</span>
                        <span class="text-lg" style="color: var(--accent);">${formatKZT(total)}</span>
                    </div>
                    <button onclick="checkoutShopOrder()" class="w-full pd-btn-gold py-3 text-sm">Оформить заказ</button>
                </div>
            `);
        };

        window.checkoutShopOrder = async function () {
            const phone = document.getElementById('orderPhone').value.trim() || 'Не указан';
            let total = 0;
            const summaryLines = [];

            cart.forEach(c => {
                const p = sharedState.shop.find(x => x.id === c.id);
                if (p) {
                    total += p.price * c.qty;
                    p.stock = Math.max(0, p.stock - c.qty);
                    summaryLines.push(`${p.title} × ${c.qty} (${formatKZT(p.price * c.qty)})`);
                }
            });

            if (userProfile.hasCard) {
                const bonusEarned = Math.round(total * (sharedState.bonusRules.cashbackPercent / 100));
                userProfile.balance += bonusEarned;
                userProfile.history.unshift({
                    title: 'Кэшбэк за покупку в магазине',
                    date: new Date().toLocaleDateString('ru-RU'),
                    delta: bonusEarned
                });
                await persistUserProfile();
            }

            await persistSharedState();
            await notifyAdmin(
                'Новый заказ в магазине!',
                `🛍️ Покупатель: ${currentUser.name} ${currentUser.username}\n📞 Телефон: ${phone}\n📦 Товары:\n• ${summaryLines.join('\n• ')}\n💰 Сумма: ${formatKZT(total)}`
            );

            cart = [];
            updateNavigation();
            closeModal();
            renderActiveTab();
            showToast('Заказ оформлен! Администратор получил уведомление.');
        };

        // Карта лояльности и касса
        window.issueLoyaltyCard = async function () {
            const num = 'PD-' + Math.floor(100000 + Math.random() * 900000);
            userProfile.hasCard = true;
            userProfile.cardNumber = num;
            userProfile.balance = sharedState.bonusRules.welcomeBonus;
            userProfile.stamps = 0;
            userProfile.freeGamesAvailable = 0;
            userProfile.history.unshift({
                title: 'Приветственный бонус за выпуск карты',
                date: new Date().toLocaleDateString('ru-RU'),
                delta: sharedState.bonusRules.welcomeBonus
            });
            await persistUserProfile();
            showToast(`Карта ${num} выпущена!`);
        };

        window.openLinkPhysicalCardModal = function () {
            openModal(`
                <div class="space-y-3">
                    <h3 class="text-lg font-black">Привязать пластиковую карту</h3>
                    <input type="text" id="physCardInput" placeholder="Номер карты (например: PD-482910)" class="pd-input">
                    <button onclick="linkPhysicalCard()" class="w-full pd-btn-primary py-3 text-sm">Привязать</button>
                </div>
            `);
        };

        window.linkPhysicalCard = async function () {
            const code = document.getElementById('physCardInput').value.trim().toUpperCase();
            if (!code) return;
            userProfile.hasCard = true;
            userProfile.cardNumber = code;
            await persistUserProfile();
            closeModal();
            showToast('Карта привязана');
        };

        window.openQrZoomModal = function () {
            openModal(`
                <div class="text-center space-y-3 py-2">
                    <h3 class="text-lg font-black">Карта гостя ${sharedState.club.name}</h3>
                    <div class="w-56 h-56 mx-auto p-3 rounded-3xl bg-white border shadow-md">
                        ${buildQrSvg(userProfile.cardNumber)}
                    </div>
                    <div class="text-base font-black tracking-wider">${userProfile.cardNumber}</div>
                    <p class="text-xs" style="color: var(--text-muted);">Покажите код администратору для начисления штампов и бонусов</p>
                </div>
            `);
        };

        window.cashierAccrueFromCheck = async function () {
            if (!userProfile.hasCard) {
                showToast('Сначала оформите карту гостя', 'error');
                return;
            }
            const amount = Number(document.getElementById('cashierCheckInput').value) || 0;
            if (amount <= 0) return;
            const bonus = Math.round(amount * (sharedState.bonusRules.cashbackPercent / 100));
            userProfile.balance += bonus;
            userProfile.history.unshift({
                title: `Кэшбэк с чека ${formatKZT(amount)}`,
                date: new Date().toLocaleDateString('ru-RU'),
                delta: bonus
            });
            await persistUserProfile();
            showToast(`Начислено +${formatKZT(bonus)}`);
        };

        window.cashierAddStamp = async function () {
            if (!userProfile.hasCard) {
                showToast('Сначала оформите карту гостя', 'error');
                return;
            }
            const freeEvery = Number(sharedState.bonusRules.freeGameEvery) || 9;
            userProfile.stamps = (userProfile.stamps || 0) + 1;

            // Если собраны 8 штампов, 9-я игротека становится бесплатной!
            if (userProfile.stamps % freeEvery === freeEvery - 1) {
                userProfile.freeGamesAvailable = (userProfile.freeGamesAvailable || 0) + 1;
                userProfile.history.unshift({
                    title: `Открыта бесплатная ${freeEvery}-я игротека!`,
                    date: new Date().toLocaleDateString('ru-RU'),
                    delta: 0,
                    badge: '🎁 0 ₸'
                });
                showToast(`Собраны ${freeEvery - 1} штампов! Следующая ${freeEvery}-я игра — 0 ₸!`);
            } else {
                userProfile.history.unshift({
                    title: 'Штамп за посещение игротеки',
                    date: new Date().toLocaleDateString('ru-RU'),
                    delta: 0,
                    badge: '+1 штамп'
                });
                showToast('Штамп за посещение добавлен');
            }
            await persistUserProfile();
        };

        window.cashierRedeemFreeGame = async function () {
            if ((userProfile.freeGamesAvailable || 0) <= 0) {
                showToast('Нет доступных бесплатных игр', 'error');
                return;
            }
            userProfile.freeGamesAvailable -= 1;
            userProfile.stamps += 1;
            userProfile.history.unshift({
                title: `Выдана бесплатная ${sharedState.bonusRules.freeGameEvery}-я игротека`,
                date: new Date().toLocaleDateString('ru-RU'),
                delta: 0,
                badge: '🎁 0 ₸'
            });
            await persistUserProfile();
            showToast('Бесплатная 9-я игра списана');
        };

        window.openImagePreview = function (src, title) {
            openModal(`
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <h3 class="text-base font-black">${title}</h3>
                        <button onclick="closeModal()" class="p-1.5 rounded-xl pd-card-soft"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <img src="${src}" alt="${title}" class="w-full rounded-2xl object-contain max-h-[65vh]">
                </div>
            `);
        };

        // Навигация и фильтры
        window.switchTab = function (tab) {
            activeTab = tab;
            updateNavigation();
            renderActiveTab();
        };
        window.setEventsFilter = function (f) {
            eventsFilter = f;
            renderActiveTab();
        };
        window.setCatalogSearch = function (v) {
            catalogSearch = v;
            renderActiveTab();
        };
        window.setCatalogGenre = function (g) {
            catalogGenre = g;
            renderActiveTab();
        };
        window.setShopSearch = function (v) {
            shopSearch = v;
            renderActiveTab();
        };
        window.setShopSort = function (v) {
            shopSort = v;
            renderActiveTab();
        };

        function renderActiveTab() {
            const container = document.getElementById('appContent');
            if (!container) return;
            if (activeTab === 'events') container.innerHTML = renderEventsTab();
            else if (activeTab === 'catalog') container.innerHTML = renderCatalogTab();
            else if (activeTab === 'shop') container.innerHTML = renderShopTab();
            else if (activeTab === 'cabinet') container.innerHTML = renderCabinetTab();
            lucide.createIcons();
        }

        function renderAll() {
            applyTheme();
            renderHeader();
            updateNavigation();
            renderActiveTab();
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderAll();
            initCloudSync();
        });
    </script>
</body>
</html>
